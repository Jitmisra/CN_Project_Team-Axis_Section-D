# config/pf_rules_isolation.conf — PF Firewall Rules for Service Isolation (Mac 3)
# Allows Mac 2 (Agnik / Nginx Edge: 10.7.14.242) to reach Backend A on port 3001
# Blocks all other machines (Mac 1, Mac 4, other campus laptops) from directly accessing port 3001

# Allow loopback for local maintenance/curl
pass in quick on lo0 proto tcp from any to any port 3001

# Block all other incoming traffic to port 3001
block in proto tcp from any to any port 3001

# Pass incoming traffic from Mac 2 (Edge / Load Balancer)
pass in proto tcp from 10.7.14.242 to any port 3001
