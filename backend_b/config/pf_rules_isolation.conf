# PF Firewall Rules for Service Isolation (Mac 4 - Port 3002)
# Allows Mac 2 (10.7.3.251) and Mac 3 (10.7.15.127) to reach Backend B
# Blocks all other incoming machines on port 3002
# Explicitly preserves outgoing traffic and non-3002 incoming traffic

# 1. Always allow all outgoing traffic statefully
pass out quick all keep state

# 2. Allow loopback on port 3002
pass in quick on lo0 proto tcp from any to any port 3002

# 3. Allow Edge tier into port 3002
pass in quick proto tcp from 10.7.3.251 to any port 3002
pass in quick proto tcp from 10.7.15.127 to any port 3002

# 4. Block everyone else on port 3002
block in quick proto tcp from any to any port 3002

# 5. Allow all other non-3002 incoming traffic
pass in quick all keep state
