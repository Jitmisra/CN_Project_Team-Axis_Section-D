# config/pf_rules_template.conf — PF Firewall Rules for Service Isolation (Mac 3)
# Goal: Allow ONLY Mac 2 (Nginx Edge) to access Backend A on port 3001.

# Allow localhost (loopback) for local health checks and testing
pass in quick on lo0 proto tcp from any to any port 3001

# Block all other incoming TCP connections on port 3001
block in proto tcp from any to any port 3001

# Allow incoming TCP connections on port 3001 from Mac 2 (Agnik / Nginx Edge)
pass in proto tcp from __MAC2_IP__ to any port 3001
